<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Draft Improver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Email Draft Improver</h1>
        <p>Paste your email draft below, choose the desired style, and let us refine it for you.</p>

        <textarea id="email-context" placeholder="If you are replying to an email, paste the original email here..."></textarea>
        <textarea id="user-draft" placeholder="Paste your draft reply here..."></textarea>

        <div class="options">
            <select id="email-style">
                <option value="professional">Professional</option>
                <option value="friendly">Friendly</option>
                <option value="concise">Concise</option>
            </select>
            <select id="output-language">
                <option value="id">Indonesian</option>
                <option value="en">English</option>
            </select>
        </div>

        <button id="improve-btn">Improve Draft</button>

        <div class="output">
            <textarea id="improved-draft" readonly placeholder="The improved draft will appear here..."></textarea>
            <button id="copy-btn">Copy Text</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
